spring.application.name=ms-risk-engine
server.port=8082
spring.docker.compose.enabled=false

logging.level.org.springframework.kafka=DEBUG
logging.level.es.NTTEnterprise.RIntellix.ms_risk_engine=DEBUG

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.client.dns.lookup=use_all_dns_ips
spring.kafka.properties.api.version.request.timeout.ms=10000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
scoring.kafka.topic.generation=GenerateScoring
scoring.kafka.topic.persist=PersistScoring

# Kafka Consumer Configuration
scoring.kafka.consumer.group-id=ms-risk-engine-standalone

# Retry Configuration
scoring.kafka.consumer.retry.max-attempts=3
scoring.kafka.consumer.retry.initial-delay=200


risk.model.base-url=${RISK_MODEL_BASE_URL:http://localhost:8000}
risk.model.predict-loan-path=/api/v1/risk/predict-loan
risk.model.predict-credit-card-path=/api/v1/risk/predict-credit-card
risk.model.version=xgboost-loan-v1

risk.core-data.base-url=${RISK_CORE_DATA_BASE_URL:http://localhost:8081}
risk.core-data.scoring-path=/api/requests/{requestId}/scoring
risk.core-data.simulation-path=/api/simulations

risk.simulation.preview.ttl-minutes=20
risk.simulation.default.ccf.normal=0.50
risk.simulation.default.ccf.revolving=0.75
risk.simulation.lgd.loan=0.70
risk.simulation.lgd.cc.normal=0.80
risk.simulation.lgd.cc.revolving=0.90
risk.simulation.lgd.mortgage.haircut=0.20
risk.simulation.lgd.mortgage.liquidation-cost-rate=0.10
risk.simulation.lgd.floor=0.10
